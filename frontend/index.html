<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d110c" />
    <script>
      // Runs before the entry module: bundled recovery cannot run if that module is missing.
      (function () {
        var recovering = false;
        var retryKey = '__vitalis_asset_retry';
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module') return;
          var asset = new URL(target.src, location.href);
          if (asset.origin !== location.origin || !asset.pathname.startsWith('/assets/')) return;
          if (recovering) return;
          recovering = true;
          var page = new URL(location.href);
          // Keep the guard in the URL: it works even when session storage is blocked.
          if (page.searchParams.has(retryKey) || navigator.onLine === false) {
            var showFailure = function () {
              var root = document.getElementById('root');
              if (root) root.textContent = 'Vitalis could not load. Check your connection and reload to try again.';
            };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', showFailure, { once: true });
            } else {
              showFailure();
            }
            return;
          }
          var reload = function () {
            page.searchParams.set(retryKey, String(Date.now()));
            location.replace(page.href);
          };
          if (!('serviceWorker' in navigator)) {
            reload();
            return;
          }
          // Give an existing cache-first worker time to update before requesting the new shell.
          var finished = false;
          var timer;
          var finish = function () {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            navigator.serviceWorker.removeEventListener('controllerchange', finish);
            reload();
          };
          navigator.serviceWorker.addEventListener('controllerchange', finish);
          timer = setTimeout(finish, 8000);
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(function (registration) { return registration.update(); })
            .catch(function () { /* Bounded retry still works if the worker is unavailable. */ });
        }, true);
      })();
    </script>
    <script>
      /* No-flash theme init: apply the saved theme class before first paint.
         Mirrors ThemeContext (key: vitalis_theme; values: light|dark|system). */
      (function () {
        try {
          var pref = localStorage.getItem('vitalis_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = pref === 'dark' || (!pref || pref === 'system') ? (pref === 'dark' || prefersDark) : false;
          document.documentElement.classList.add(dark ? 'dark-theme' : 'light-theme');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0d110c' : '#f5f7f1');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Vitalis — AI-powered fitness tracking, nutrition, sleep and coaching." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vitalis — AI-powered fitness tracking" />
    <meta property="og:description" content="Track workouts, nutrition, sleep and coaching with AI." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vitalis — AI-powered fitness tracking" />
    <meta name="twitter:description" content="Track workouts, nutrition, sleep and coaching with AI." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vitalis" />
    <link rel="preconnect" href="https://accounts.google.com" />
    <!-- Boot loader art: 9KB WebP (was a 2.4MB PNG), so it can load at normal priority. -->
    <link rel="preload" as="image" href="/Loading_green.webp" type="image/webp" />
    <title>Vitalis</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;text-align:center;font-family:sans-serif">Vitalis needs JavaScript to run. Please enable it and reload.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
